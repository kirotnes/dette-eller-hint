<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dette eller hint?</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #191c23;
    --card-hi: #222630;
    --line: #2c313c;
    --text: #f2f4f8;
    --muted: #949cad;
    --a: #7c5cff;
    --b: #00c2a8;
    --ok: #2fd07a;
    --no: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px 64px;
  }
  main { width: 100%; max-width: 560px; }
  h1 { font-size: 30px; margin: 0 0 4px; letter-spacing: -0.02em; }
  h2 { font-size: 20px; margin: 0 0 12px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .hidden { display: none !important; }

  input[type=text] {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    margin-bottom: 16px;
  }
  input[type=text]:focus { outline: none; border-color: var(--a); }

  button.primary {
    width: 100%;
    padding: 15px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    background: var(--a);
    color: #fff;
    cursor: pointer;
  }
  button.primary:disabled { opacity: .35; cursor: not-allowed; }
  button.ghost {
    width: 100%;
    padding: 13px;
    font-size: 15px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    margin-top: 10px;
  }

  /* progress */
  .bar { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 8px; }
  .bar > i { display: block; height: 100%; background: var(--a); transition: width .25s ease; }
  .count { color: var(--muted); font-size: 13px; margin-bottom: 24px; }

  /* question */
  .cat {
    text-transform: uppercase;
    letter-spacing: .08em;
    font-size: 11px;
    font-weight: 700;
    color: var(--a);
    margin-bottom: 10px;
  }
  .q { font-size: 24px; font-weight: 600; margin-bottom: 24px; letter-spacing: -0.01em; }
  .opts { display: grid; gap: 12px; }
  .opt {
    padding: 22px 18px;
    font-size: 18px;
    font-weight: 600;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    color: var(--text);
    cursor: pointer;
    transition: transform .08s ease, border-color .15s ease, background .15s ease;
  }
  .opt:hover { border-color: var(--a); background: var(--card-hi); }
  .opt:active { transform: scale(.985); }

  /* share */
  .linkbox {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    font-size: 13px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted);
    word-break: break-all;
    margin-bottom: 14px;
    max-height: 120px;
    overflow: auto;
  }

  /* result */
  .score {
    text-align: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 26px;
    margin-bottom: 22px;
  }
  .score b { display: block; font-size: 52px; line-height: 1; letter-spacing: -0.03em; }
  .score span { color: var(--muted); font-size: 14px; }
  .names { display: flex; gap: 8px; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 8px; padding: 0 2px; }
  .names > *:first-child { flex: 1; }
  .names > *:last-child { flex: 1; text-align: right; }
  .row {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--no);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .row.same { border-left-color: var(--ok); }
  .row .qt { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .row .pair { display: flex; gap: 10px; align-items: baseline; font-weight: 600; }
  .row .pair > *:first-child { flex: 1; }
  .row .pair > *:last-child { flex: 1; text-align: right; }
  .row .vs { color: var(--muted); font-size: 11px; font-weight: 400; }
  .row.same .pair > * { color: var(--ok); }
</style>
</head>
<body>
<main>

  <!-- START -->
  <section id="start">
    <h1>Dette eller hint?</h1>
    <p class="sub" id="startSub">12 kjappe valg. Svar, send lenka til den andre, se hvor like dere er.</p>
    <input type="text" id="name" placeholder="Fornavnet ditt" autocomplete="given-name" maxlength="20">
    <button class="primary" id="go">Start</button>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="bar"><i id="fill" style="width:0%"></i></div>
    <div class="count" id="count"></div>
    <div class="cat" id="cat"></div>
    <div class="q" id="q"></div>
    <div class="opts">
      <button class="opt" id="optA"></button>
      <button class="opt" id="optB"></button>
    </div>
    <button class="ghost" id="back">← Tilbake</button>
  </section>

  <!-- SHARE (person 1 done) -->
  <section id="share" class="hidden">
    <h2>Ferdig! 🎉</h2>
    <p class="sub">Send denne lenka til den andre. Svarene dine ligger i lenka — de ser dem ikke før de har svart selv.</p>
    <div class="linkbox" id="link"></div>
    <button class="primary" id="copy">Kopier lenke</button>
  </section>

  <!-- RESULT -->
  <section id="result" class="hidden">
    <div class="score">
      <b id="pct">0%</b>
      <span id="scoreText"></span>
    </div>
    <div class="names"><div id="n1"></div><div id="n2"></div></div>
    <div id="rows"></div>
    <button class="ghost" id="copyBoth">Kopier resultatlenke (send tilbake)</button>
  </section>

</main>
<script>
const QUESTIONS = [
  { cat: 'Drikke og uteliv',     q: 'Øl eller vin?',                                a: 'Øl',                     b: 'Vin' },
  { cat: 'Drikke og uteliv',     q: 'Kaffe eller te?',                              a: 'Kaffe',                  b: 'Te' },
  { cat: 'Drikke og uteliv',     q: 'Utested eller hjemmefest?',                    a: 'Utested',                b: 'Hjemmefest' },
  { cat: 'Drikke og uteliv',     q: 'Fint restaurantbesøk eller gatemat?',          a: 'Fin restaurant',         b: 'Gatemat' },
  { cat: 'Reise og opplevelser', q: 'Storby eller syden?',                          a: 'Storby',                 b: 'Syden' },
  { cat: 'Reise og opplevelser', q: 'Hotelluksus eller telttur på fjellet?',        a: 'Hotelluksus',            b: 'Telttur på fjellet' },
  { cat: 'Reise og opplevelser', q: 'Planlegge alt eller ta ting på sparket?',      a: 'Planlegge alt',          b: 'Ta det på sparket' },
  { cat: 'Reise og opplevelser', q: 'Museum og kultur eller fornøyelsespark?',      a: 'Museum og kultur',       b: 'Fornøyelsespark' },
  { cat: 'Hverdag og livsstil',  q: 'Bysommer eller hytteliv?',                     a: 'Bysommer',               b: 'Hytteliv' },
  { cat: 'Hverdag og livsstil',  q: 'B-menneske eller A-menneske?',                 a: 'B-menneske',             b: 'A-menneske' },
  { cat: 'Hverdag og livsstil',  q: 'Hund eller katt?',                             a: 'Hund',                   b: 'Katt' },
  { cat: 'Hverdag og livsstil',  q: 'Se film hjemme eller gå på kino?',             a: 'Film hjemme',            b: 'Kino' },
];

const $ = id => document.getElementById(id);
const N = QUESTIONS.length;

// --- encode/decode: name + answer bits packed into the URL hash ---
function pack(name, answers) {
  // leading 1 sentinel keeps leading zeros; base36 keeps it short
  const bits = parseInt('1' + answers.join(''), 2).toString(36);
  return encodeURIComponent(name) + '.' + bits;
}
function unpack(str) {
  const i = str.lastIndexOf('.');
  const name = decodeURIComponent(str.slice(0, i));
  const bin = parseInt(str.slice(i + 1), 36).toString(2).slice(1); // drop sentinel
  if (bin.length !== N) throw new Error('bad payload');
  return { name, answers: bin.split('').map(Number) };
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  const out = {};
  for (const k of ['a', 'b']) {
    if (p.has(k)) { try { out[k] = unpack(p.get(k)); } catch (e) { /* ignore junk */ } }
  }
  return out;
}
const baseUrl = () => location.href.split('#')[0];

// --- state ---
let me = { name: '', answers: [] };
let other = null;   // person 1's entry, when we arrived via a shared link
let step = 0;

const show = id => {
  ['start', 'quiz', 'share', 'result'].forEach(s => $(s).classList.toggle('hidden', s !== id));
  window.scrollTo(0, 0);
};

// --- quiz ---
function render() {
  const item = QUESTIONS[step];
  $('fill').style.width = (step / N * 100) + '%';
  $('count').textContent = `Spørsmål ${step + 1} av ${N}`;
  $('cat').textContent = item.cat;
  $('q').textContent = item.q;
  $('optA').textContent = item.a;
  $('optB').textContent = item.b;
  $('back').classList.toggle('hidden', step === 0);
}

function answer(v) {
  me.answers[step] = v;
  step++;
  if (step < N) render(); else finish();
}

function finish() {
  const mine = pack(me.name, me.answers);
  if (other) {
    location.hash = `a=${pack(other.name, other.answers)}&b=${mine}`;
    showResult(other, me);
  } else {
    const url = baseUrl() + '#a=' + mine;
    $('link').textContent = url;
    $('copy').dataset.url = url;
    show('share');
  }
}

// --- result ---
function showResult(p1, p2) {
  const same = QUESTIONS.filter((_, i) => p1.answers[i] === p2.answers[i]).length;
  const pct = Math.round(same / N * 100);
  $('pct').textContent = pct + '%';
  $('scoreText').textContent = `${same} av ${N} like svar — ${p1.name} og ${p2.name}`;
  $('n1').textContent = p1.name;
  $('n2').textContent = p2.name;
  $('rows').innerHTML = QUESTIONS.map((item, i) => {
    const pick = (p, i) => p.answers[i] ? QUESTIONS[i].b : QUESTIONS[i].a;
    const match = p1.answers[i] === p2.answers[i];
    const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    return `<div class="row ${match ? 'same' : ''}">
      <div class="qt">${esc(item.q)}</div>
      <div class="pair">
        <div>${esc(pick(p1, i))}</div>
        ${match ? '' : '<div class="vs">vs</div>'}
        <div>${esc(pick(p2, i))}</div>
      </div>
    </div>`;
  }).join('');
  $('copyBoth').dataset.url = location.href;
  show('result');
}

// --- wiring ---
$('go').onclick = () => {
  const n = $('name').value.trim();
  if (!n) { $('name').focus(); return; }
  me.name = n;
  step = 0;
  me.answers = [];
  render();
  show('quiz');
};
$('name').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
$('optA').onclick = () => answer(0);
$('optB').onclick = () => answer(1);
$('back').onclick = () => { if (step > 0) { step--; render(); } };

async function copy(btn) {
  const url = btn.dataset.url;
  const old = btn.textContent;
  try { await navigator.clipboard.writeText(url); btn.textContent = 'Kopiert ✓'; }
  catch { prompt('Kopier lenka:', url); return; }
  setTimeout(() => btn.textContent = old, 1600);
}
$('copy').onclick = e => copy(e.target);
$('copyBoth').onclick = e => copy(e.target);

// --- boot ---
(function boot() {
  const h = readHash();
  if (h.a && h.b) {
    showResult(h.a, h.b);          // both done — anyone with this link sees the comparison
  } else if (h.a) {
    other = h.a;                    // person 2 arriving via the shared link
    $('startSub').textContent = `${other.name} har svart. Svar du også, så ser dere sammenligningen.`;
    show('start');
  } else {
    show('start');
  }
})();
</script>
</body>
</html>
