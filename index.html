<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dette eller hint?</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #191c23;
    --card-hi: #222630;
    --line: #2c313c;
    --text: #f2f4f8;
    --muted: #949cad;
    --a: #7c5cff;
    --b: #00c2a8;
    --ok: #2fd07a;
    --no: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px 64px;
  }
  main { width: 100%; max-width: 560px; }
  h1 { font-size: 30px; margin: 0 0 4px; letter-spacing: -0.02em; }
  h2 { font-size: 20px; margin: 0 0 12px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .hidden { display: none !important; }

  input[type=text] {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    margin-bottom: 16px;
  }
  input[type=text]:focus { outline: none; border-color: var(--a); }

  button.primary {
    width: 100%;
    padding: 15px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    background: var(--a);
    color: #fff;
    cursor: pointer;
  }
  button.primary:disabled { opacity: .35; cursor: not-allowed; }
  button.ghost {
    width: 100%;
    padding: 13px;
    font-size: 15px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    margin-top: 10px;
  }

  /* round picker */
  .rounds { display: grid; gap: 12px; }
  .round {
    padding: 18px;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    color: var(--text);
    cursor: pointer;
    transition: transform .08s ease, border-color .15s ease, background .15s ease;
  }
  .round:hover { border-color: var(--a); background: var(--card-hi); }
  .round:active { transform: scale(.985); }
  .round b { display: block; font-size: 18px; font-weight: 600; margin-bottom: 3px; }
  .round span { color: var(--muted); font-size: 14px; }

  /* progress */
  .bar { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 8px; }
  .bar > i { display: block; height: 100%; background: var(--a); transition: width .25s ease; }
  .count { color: var(--muted); font-size: 13px; margin-bottom: 24px; }

  /* question */
  .cat {
    text-transform: uppercase;
    letter-spacing: .08em;
    font-size: 11px;
    font-weight: 700;
    color: var(--a);
    margin-bottom: 10px;
  }
  .q { font-size: 24px; font-weight: 600; margin-bottom: 24px; letter-spacing: -0.01em; }
  .opts { display: grid; gap: 12px; }
  .opt {
    padding: 22px 18px;
    font-size: 18px;
    font-weight: 600;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    color: var(--text);
    cursor: pointer;
    transition: transform .08s ease, border-color .15s ease, background .15s ease;
  }
  .opt:hover { border-color: var(--a); background: var(--card-hi); }
  .opt:active { transform: scale(.985); }

  /* share */
  .linkbox {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    font-size: 13px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted);
    word-break: break-all;
    margin-bottom: 14px;
    max-height: 120px;
    overflow: auto;
  }

  /* result */
  .score {
    text-align: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 26px;
    margin-bottom: 22px;
  }
  .score b { display: block; font-size: 52px; line-height: 1; letter-spacing: -0.03em; }
  .score span { color: var(--muted); font-size: 14px; }
  .names { display: flex; gap: 8px; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 8px; padding: 0 2px; }
  .names > *:first-child { flex: 1; }
  .names > *:last-child { flex: 1; text-align: right; }
  .row {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--no);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .row.same { border-left-color: var(--ok); }
  .row .qt { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .row .pair { display: flex; gap: 10px; align-items: baseline; font-weight: 600; }
  .row .pair > *:first-child { flex: 1; }
  .row .pair > *:last-child { flex: 1; text-align: right; }
  .row .vs { color: var(--muted); font-size: 11px; font-weight: 400; }
  .row.same .pair > * { color: var(--ok); }

  /* free text */
  textarea {
    width: 100%;
    min-height: 160px;
    padding: 14px 16px;
    font-family: inherit;
    font-size: 16px;
    line-height: 1.5;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    resize: vertical;
  }
  textarea:focus { outline: none; border-color: var(--a); }
  .counter { text-align: right; font-size: 12px; color: var(--muted); margin: 6px 2px 16px; }
  .counter.near { color: var(--no); }

  .trow {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .trow > .qt { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
  .ans { border-left: 3px solid var(--a); padding-left: 12px; margin-top: 12px; }
  .ans:nth-of-type(2) { border-left-color: var(--b); }
  .ans b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 3px; }
  .ans p { margin: 0; white-space: pre-wrap; }
</style>
</head>
<body>
<main>

  <!-- ROUND PICKER -->
  <section id="pick" class="hidden">
    <h1>Dette eller hint?</h1>
    <p class="sub">Svar, send lenka til den andre, se hvor like dere er.</p>
    <div class="rounds" id="rounds"></div>
  </section>

  <!-- NAME -->
  <section id="start" class="hidden">
    <h1 id="startTitle">Dette eller hint?</h1>
    <p class="sub" id="startSub"></p>
    <input type="text" id="name" placeholder="Fornavnet ditt" autocomplete="given-name" maxlength="20">
    <button class="primary" id="go">Start</button>
    <button class="ghost hidden" id="changeRound">← Velg en annen runde</button>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="bar"><i id="fill" style="width:0%"></i></div>
    <div class="count" id="count"></div>
    <div class="cat" id="cat"></div>
    <div class="q" id="q"></div>
    <div class="opts" id="opts">
      <button class="opt" id="optA"></button>
      <button class="opt" id="optB"></button>
    </div>
    <div id="textWrap" class="hidden">
      <textarea id="text" maxlength="300" placeholder="Skriv i vei …"></textarea>
      <div class="counter" id="counter">0 / 300</div>
      <button class="primary" id="next">Neste</button>
    </div>
    <button class="ghost" id="back">← Tilbake</button>
  </section>

  <!-- SHARE (person 1 done) -->
  <section id="share" class="hidden">
    <h2>Ferdig! 🎉</h2>
    <p class="sub">Send denne lenka til den andre. Svarene dine ligger i lenka — de ser dem ikke før de har svart selv.</p>
    <div class="linkbox" id="link"></div>
    <button class="primary" id="copy">Kopier lenke</button>
  </section>

  <!-- RESULT -->
  <section id="result" class="hidden">
    <div class="score" id="scoreCard">
      <b id="pct">0%</b>
      <span id="scoreText"></span>
    </div>
    <div class="names" id="namesRow"><div id="n1"></div><div id="n2"></div></div>
    <h2 id="textHead" class="hidden"></h2>
    <div id="rows"></div>
    <button class="ghost" id="copyBoth">Kopier resultatlenke (send tilbake)</button>
    <button class="ghost" id="again">Ta en annen runde</button>
  </section>

</main>
<script>
const ROUNDS = [
  {
    name: 'Runde 1',
    tag: 'Drikke, reise og hverdag',
    questions: [
      { cat: 'Drikke og uteliv',     q: 'Øl eller vin?',                           a: 'Øl',               b: 'Vin' },
      { cat: 'Drikke og uteliv',     q: 'Kaffe eller te?',                         a: 'Kaffe',            b: 'Te' },
      { cat: 'Drikke og uteliv',     q: 'Utested eller hjemmefest?',               a: 'Utested',          b: 'Hjemmefest' },
      { cat: 'Drikke og uteliv',     q: 'Fint restaurantbesøk eller gatemat?',     a: 'Fin restaurant',   b: 'Gatemat' },
      { cat: 'Reise og opplevelser', q: 'Storby eller syden?',                     a: 'Storby',           b: 'Syden' },
      { cat: 'Reise og opplevelser', q: 'Hotelluksus eller telttur på fjellet?',   a: 'Hotelluksus',      b: 'Telttur på fjellet' },
      { cat: 'Reise og opplevelser', q: 'Planlegge alt eller ta ting på sparket?', a: 'Planlegge alt',    b: 'Ta det på sparket' },
      { cat: 'Reise og opplevelser', q: 'Museum og kultur eller fornøyelsespark?', a: 'Museum og kultur', b: 'Fornøyelsespark' },
      { cat: 'Hverdag og livsstil',  q: 'Bysommer eller hytteliv?',                a: 'Bysommer',         b: 'Hytteliv' },
      { cat: 'Hverdag og livsstil',  q: 'B-menneske eller A-menneske?',            a: 'B-menneske',       b: 'A-menneske' },
      { cat: 'Hverdag og livsstil',  q: 'Hund eller katt?',                        a: 'Hund',             b: 'Katt' },
      { cat: 'Hverdag og livsstil',  q: 'Se film hjemme eller gå på kino?',        a: 'Film hjemme',      b: 'Kino' },
    ],
  },
  {
    name: 'Runde 2',
    tag: 'Mat, helg og hverdagskrangler',
    questions: [
      { cat: 'Mat og kos',         q: 'Taco eller pizza?',                              a: 'Taco',            b: 'Pizza' },
      { cat: 'Mat og kos',         q: 'Søtt eller salt?',                               a: 'Søtt',            b: 'Salt' },
      { cat: 'Mat og kos',         q: 'Lage mat selv eller bestille hjem?',             a: 'Lage mat selv',   b: 'Bestille hjem' },
      { cat: 'Helg og fritid',     q: 'Sove lenge eller opp tidlig i helga?',           a: 'Sove lenge',      b: 'Opp tidlig' },
      { cat: 'Helg og fritid',     q: 'Konsert eller festival?',                        a: 'Konsert',         b: 'Festival' },
      { cat: 'Folk og sosialt',    q: 'Stor gjeng eller få nære?',                      a: 'Stor gjeng',      b: 'Få nære' },
      { cat: 'Folk og sosialt',    q: 'Ringe eller sende melding?',                     a: 'Ringe',           b: 'Sende melding' },
      { cat: 'Skjerm og lyd',      q: 'Serie eller film?',                              a: 'Serie',           b: 'Film' },
      { cat: 'Skjerm og lyd',      q: 'Binge hele sesongen eller én episode om gangen?', a: 'Binge alt',      b: 'Én om gangen' },
      { cat: 'Penger',             q: 'Spare eller bruke?',                             a: 'Spare',           b: 'Bruke' },
      { cat: 'Hverdagskrangler',   q: 'Seng redd opp eller rotete?',                    a: 'Redd opp',        b: 'Rotete' },
      { cat: 'Hverdagskrangler',   q: 'Brunost eller nei takk?',                        a: 'Brunost',         b: 'Nei takk' },
    ],
  },
  {
    name: 'Runde 3',
    tag: 'Tre store spørsmål — skriv fritt',
    type: 'text',
    questions: [
      { cat: 'Deg selv',   q: 'Hva er dine tre beste og tre verste egenskaper?', ph: 'Tre du liker ved deg selv, og tre du helst skulle vært foruten …' },
      { cat: 'Hvile',      q: 'Hva gjør du når du skal slappe av?',              ph: 'En helt vanlig kveld uten planer — hva skjer?' },
      { cat: 'Den andre',  q: 'Hvordan vil du at partneren din skal være?',      ph: 'Egenskaper, verdier, humor — det som faktisk betyr noe …' },
    ],
  },
  {
    name: 'Runde 4',
    tag: 'Verdier og fremtid',
    type: 'text',
    questions: [
      { cat: 'Verdier',       q: 'Hvilke verdier håper du en partner deler med deg?',          ph: 'Det du ikke gidder å forklare eller forsvare …' },
      { cat: 'Forventninger', q: 'Hva ønsker du at et forhold skal bidra med i livet ditt?',   ph: 'Ro, driv, utfordring, selskap — hva er det du faktisk er ute etter?' },
      { cat: 'De rundt oss',  q: 'Hvilken rolle spiller familie og venner i et fremtidig forhold?', ph: 'Hvor tett, hvor ofte, hvor viktig?' },
      { cat: 'Grenser',       q: 'Hva er du ikke villig til å kompromisse på?',                ph: 'Det som ikke er til forhandling, uansett hvor bra alt annet er …' },
    ],
  },
  {
    name: 'Runde 5',
    tag: 'De dype spørsmålene',
    type: 'text',
    questions: [
      { cat: 'Kommunikasjon',  q: 'Hvilken type kommunikasjon får deg til å trekke deg unna?',          ph: 'Tonefall, stillhet, krangling, mas — hva lukker deg?' },
      { cat: 'Erfaring',       q: 'Hva lærte tidligere forhold deg om hva du trenger?',                 ph: 'Det du skjønte først etterpå …' },
      { cat: 'Frykt',          q: 'Hvilken frykt har du når det gjelder kjærlighet?',                   ph: 'Den du sjelden sier høyt.' },
      { cat: 'Misforståelser', q: 'Hva er den største misforståelsen folk har om deg som partner?',     ph: 'Hva tror folk om deg som ikke stemmer?' },
      { cat: 'Vekst',          q: 'På hvilke områder ønsker du å vokse sammen med noen?',               ph: 'Noe du vil bli bedre til, men ikke klarer alene …' },
      { cat: 'Drømmen',        q: 'Hvis et forhold skulle lykkes fullt ut, hvordan ville det kjennes ut?', ph: 'Beskriv følelsen, ikke planen.' },
    ],
  },
  {
    name: 'Runde 6',
    tag: 'Lekent, men avslørende',
    type: 'text',
    questions: [
      { cat: 'Uten frykt',     q: 'Hvem ville du vært som kjæreste hvis ingen var redde for å bli såret?', ph: 'Den versjonen av deg som ikke holder igjen …' },
      { cat: 'Grønt flagg',    q: 'Hva er det grønne flagget du ser etter hos noen?',                      ph: 'Den lille tingen som får deg til å slappe av.' },
      { cat: 'Gjenkjennelsen', q: 'Hva gjør at du tenker «denne personen kunne jeg bygget et liv med»?',   ph: 'Øyeblikket der det plutselig føles opplagt …' },
    ],
  },
];

const MAXLEN = 300;
const isText = () => ROUNDS[roundIdx].type === 'text';

const $ = id => document.getElementById(id);

// --- state ---
let roundIdx = 0;
let questions = ROUNDS[0].questions;
let me = { name: '', answers: [] };
let other = null;   // person 1's entry, when we arrived via a shared link
let step = 0;

const setRound = i => { roundIdx = i; questions = ROUNDS[i].questions; };

// --- base64url + optional deflate, for the bulkier free-text payloads ---
const b64 = {
  enc: bytes => btoa(Array.from(bytes, c => String.fromCharCode(c)).join(''))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
  dec: s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0)),
};
async function squeeze(bytes, mode) {
  const Stream = mode === 'in' ? self.CompressionStream : self.DecompressionStream;
  if (!Stream) return null;
  try {
    const s = new Blob([bytes]).stream().pipeThrough(new Stream('deflate-raw'));
    return new Uint8Array(await new Response(s).arrayBuffer());
  } catch (e) { return null; }
}

// --- encode/decode: name + answers packed into the URL hash ---
// choice rounds: "Navn.<bits-as-base36>"  |  text rounds: "z<b64>" (deflated) or "u<b64>"
async function pack(name, answers) {
  if (!isText()) {
    // leading 1 sentinel keeps leading zeros; base36 keeps it short
    const bits = parseInt('1' + answers.join(''), 2).toString(36);
    return encodeURIComponent(name) + '.' + bits;
  }
  const raw = new TextEncoder().encode(JSON.stringify([name, ...answers]));
  const gz = await squeeze(raw, 'in');
  return gz && gz.length < raw.length ? 'z' + b64.enc(gz) : 'u' + b64.enc(raw);
}
async function unpack(str, round) {
  if (round.type !== 'text') {
    const i = str.lastIndexOf('.');
    const name = decodeURIComponent(str.slice(0, i));
    const bin = parseInt(str.slice(i + 1), 36).toString(2).slice(1); // drop sentinel
    if (bin.length !== round.questions.length) throw new Error('bad payload');
    return { name, answers: bin.split('').map(Number) };
  }
  let bytes = b64.dec(str.slice(1));
  if (str[0] === 'z') {
    bytes = await squeeze(bytes, 'out');
    if (!bytes) throw new Error('no DecompressionStream');
  }
  const [name, ...answers] = JSON.parse(new TextDecoder().decode(bytes));
  if (answers.length !== round.questions.length) throw new Error('bad payload');
  return { name, answers };
}
async function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  // no r= means a round-1 link from before the picker existed
  const r = Math.min(Math.max(parseInt(p.get('r') || '0', 10) || 0, 0), ROUNDS.length - 1);
  const out = { r };
  for (const k of ['a', 'b']) {
    if (p.has(k)) { try { out[k] = await unpack(p.get(k), ROUNDS[r]); } catch (e) { /* ignore junk */ } }
  }
  return out;
}
const baseUrl = () => location.href.split('#')[0];

const show = id => {
  ['pick', 'start', 'quiz', 'share', 'result'].forEach(s => $(s).classList.toggle('hidden', s !== id));
  window.scrollTo(0, 0);
};

// --- round picker ---
$('rounds').innerHTML = ROUNDS.map((r, i) =>
  `<button class="round" data-i="${i}"><b>${r.name}</b><span>${r.tag}</span></button>`).join('');
$('rounds').onclick = e => {
  const btn = e.target.closest('.round');
  if (btn) { setRound(+btn.dataset.i); toName(); }
};

function toName() {
  $('startTitle').textContent = ROUNDS[roundIdx].name;
  $('startSub').textContent = other
    ? `${other.name} har svart på ${ROUNDS[roundIdx].name.toLowerCase()}. Svar du også, så ser dere svarene.`
    : isText()
      ? `${questions.length} spørsmål, ingen fasit. Skriv så langt eller kort du vil — maks ${MAXLEN} tegn.`
      : `${questions.length} kjappe valg — ${ROUNDS[roundIdx].tag.toLowerCase()}.`;
  $('changeRound').classList.toggle('hidden', !!other);
  show('start');
  $('name').focus();
}

// --- quiz ---
function render() {
  const item = questions[step];
  $('fill').style.width = (step / questions.length * 100) + '%';
  $('count').textContent = `Spørsmål ${step + 1} av ${questions.length}`;
  $('cat').textContent = item.cat;
  $('q').textContent = item.q;
  $('opts').classList.toggle('hidden', isText());
  $('textWrap').classList.toggle('hidden', !isText());
  if (isText()) {
    $('text').value = me.answers[step] || '';
    $('text').placeholder = item.ph;
    countText();
    $('text').focus();
  } else {
    $('optA').textContent = item.a;
    $('optB').textContent = item.b;
  }
  $('back').classList.toggle('hidden', step === 0);
}

function countText() {
  const n = $('text').value.length;
  $('counter').textContent = `${n} / ${MAXLEN}`;
  $('counter').classList.toggle('near', n > MAXLEN - 40);
  $('next').disabled = !$('text').value.trim();
}

function answer(v) {
  me.answers[step] = v;
  step++;
  if (step < questions.length) render(); else finish();
}

async function finish() {
  const mine = await pack(me.name, me.answers);
  if (other) {
    location.hash = `r=${roundIdx}&a=${await pack(other.name, other.answers)}&b=${mine}`;
    showResult(other, me);
  } else {
    const url = `${baseUrl()}#r=${roundIdx}&a=${mine}`;
    $('link').textContent = url;
    $('copy').dataset.url = url;
    show('share');
  }
}

// --- result ---
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function showResult(p1, p2) {
  $('scoreCard').classList.toggle('hidden', isText());
  $('namesRow').classList.toggle('hidden', isText());
  $('textHead').classList.toggle('hidden', !isText());
  if (isText()) return showTextResult(p1, p2);

  const same = questions.filter((_, i) => p1.answers[i] === p2.answers[i]).length;
  const n = questions.length;
  $('pct').textContent = Math.round(same / n * 100) + '%';
  $('scoreText').textContent = `${same} av ${n} like svar — ${p1.name} og ${p2.name} · ${ROUNDS[roundIdx].name}`;
  $('n1').textContent = p1.name;
  $('n2').textContent = p2.name;
  $('rows').innerHTML = questions.map((item, i) => {
    const pick = p => p.answers[i] ? item.b : item.a;
    const match = p1.answers[i] === p2.answers[i];
    return `<div class="row ${match ? 'same' : ''}">
      <div class="qt">${esc(item.q)}</div>
      <div class="pair">
        <div>${esc(pick(p1))}</div>
        ${match ? '' : '<div class="vs">vs</div>'}
        <div>${esc(pick(p2))}</div>
      </div>
    </div>`;
  }).join('');
  $('copyBoth').dataset.url = location.href;
  show('result');
}

// free-text rounds have nothing to score — just put the answers side by side
function showTextResult(p1, p2) {
  $('textHead').textContent = `${p1.name} og ${p2.name} · ${ROUNDS[roundIdx].name}`;
  $('rows').innerHTML = questions.map((item, i) => `
    <div class="trow">
      <div class="qt">${esc(item.q)}</div>
      <div class="ans"><b>${esc(p1.name)}</b><p>${esc(p1.answers[i])}</p></div>
      <div class="ans"><b>${esc(p2.name)}</b><p>${esc(p2.answers[i])}</p></div>
    </div>`).join('');
  $('copyBoth').dataset.url = location.href;
  show('result');
}

// --- wiring ---
$('go').onclick = () => {
  const n = $('name').value.trim();
  if (!n) { $('name').focus(); return; }
  me = { name: n, answers: [] };
  step = 0;
  render();
  show('quiz');
};
$('name').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
$('optA').onclick = () => answer(0);
$('optB').onclick = () => answer(1);
$('text').oninput = countText;
$('next').onclick = () => { if ($('text').value.trim()) answer($('text').value.trim()); };
$('back').onclick = () => { if (step > 0) { step--; render(); } };
$('changeRound').onclick = () => show('pick');
$('again').onclick = () => { location.hash = ''; other = null; show('pick'); };

async function copy(btn) {
  const url = btn.dataset.url;
  const old = btn.textContent;
  try { await navigator.clipboard.writeText(url); btn.textContent = 'Kopiert ✓'; }
  catch { prompt('Kopier lenka:', url); return; }
  setTimeout(() => btn.textContent = old, 1600);
}
$('copy').onclick = e => copy(e.target);
$('copyBoth').onclick = e => copy(e.target);

// --- boot ---
(async function boot() {
  const h = await readHash();
  setRound(h.r);
  if (h.a && h.b) {
    showResult(h.a, h.b);          // both done — anyone with this link sees the comparison
  } else if (h.a) {
    other = h.a;                    // person 2 arriving via the shared link
    toName();
  } else {
    show('pick');
  }
})();
</script>
</body>
</html>
